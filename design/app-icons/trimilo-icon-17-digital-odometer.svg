<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg17)"/>

  <!-- odometer housing -->
  <rect x="106" y="196" width="300" height="120" rx="20" fill="#0F172A"/>

  <!-- digit windows -->
  <g fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" text-anchor="middle">
    <rect x="122" y="212" width="52" height="88" rx="8" fill="#1E293B"/>
    <text x="148" y="272">1</text>
    <rect x="182" y="212" width="52" height="88" rx="8" fill="#1E293B"/>
    <text x="208" y="272">2</text>
    <rect x="242" y="212" width="52" height="88" rx="8" fill="#1E293B"/>
    <text x="268" y="272">4</text>
    <rect x="302" y="212" width="52" height="88" rx="8" fill="#1E293B"/>
    <text x="328" y="272">7</text>
  </g>

  <!-- km label -->
  <rect x="106" y="340" width="300" height="40" rx="14" fill="#F8FAFC"/>
  <text x="256" y="368" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1D4ED8" text-anchor="middle">KILOMETERS</text>
</svg>
