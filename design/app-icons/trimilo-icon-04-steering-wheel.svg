<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg4)"/>

  <!-- steering wheel -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#F8FAFC" stroke-width="22"/>
  <circle cx="256" cy="256" r="40" fill="#F59E0B"/>
  <g stroke="#F8FAFC" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="150"/>
    <line x1="256" y1="256" x2="166" y2="308"/>
    <line x1="256" y1="256" x2="346" y2="308"/>
  </g>

  <!-- distance readout badge -->
  <rect x="176" y="380" width="160" height="56" rx="16" fill="#F59E0B"/>
  <text x="256" y="418" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">km</text>
</svg>
