<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg20)"/>

  <!-- stopwatch -->
  <rect x="228" y="96" width="56" height="28" rx="10" fill="#F8FAFC"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="#F8FAFC" stroke-width="24"/>
  <line x1="256" y1="150" x2="256" y2="170" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>

  <!-- watch hands -->
  <line x1="256" y1="270" x2="256" y2="196" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="270" x2="316" y2="290" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="270" r="12" fill="#F8FAFC"/>

  <!-- small car silhouette resting on the dial base -->
  <g transform="translate(256,392)">
    <rect x="-52" y="-8" width="104" height="24" rx="12" fill="#93C5FD"/>
    <path d="M-34 -8 L-22 -28 C-18 -34 -10 -38 -2 -38 L2 -38 C10 -38 18 -34 22 -28 L34 -8 Z" fill="#93C5FD"/>
    <circle cx="-24" cy="18" r="12" fill="#1E3A8A"/>
    <circle cx="24" cy="18" r="12" fill="#1E3A8A"/>
  </g>
</svg>
