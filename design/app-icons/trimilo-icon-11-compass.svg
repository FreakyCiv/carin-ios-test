<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg11)"/>

  <!-- compass ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#93C5FD" stroke-width="14"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>

  <!-- N/E/S/W ticks -->
  <g fill="#BFDBFE">
    <circle cx="256" cy="120" r="6"/>
    <circle cx="392" cy="256" r="6"/>
    <circle cx="256" cy="392" r="6"/>
    <circle cx="120" cy="256" r="6"/>
  </g>

  <!-- compass needle shaped like a car direction pointer -->
  <g transform="rotate(28 256 256)">
    <path d="M256 150 L286 280 L256 256 L226 280 Z" fill="#F8FAFC"/>
  </g>
  <circle cx="256" cy="256" r="16" fill="#F8FAFC"/>
