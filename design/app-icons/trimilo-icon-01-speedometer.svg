<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg1)"/>

  <!-- gauge track -->
  <path d="M 126 300 A 140 140 0 1 1 386 300" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="26" stroke-linecap="round"/>
  <!-- gauge progress -->
  <path d="M 126 300 A 140 140 0 0 1 340 190" fill="none" stroke="url(#arc1)" stroke-width="26" stroke-linecap="round"/>

  <!-- ticks -->
  <g stroke="rgba(255,255,255,0.8)" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="140" x2="256" y2="160"/>
    <line x1="150" y1="200" x2="166" y2="212"/>
    <line x1="362" y1="200" x2="346" y2="212"/>
    <line x1="120" y1="300" x2="140" y2="300"/>
    <line x1="392" y1="300" x2="372" y2="300"/>
  </g>

  <!-- needle -->
  <g transform="rotate(35 256 300)">
    <path d="M256 300 L246 176 L266 176 Z" fill="#F8FAFC"/>
  </g>
  <circle cx="256" cy="300" r="18" fill="#0F172A"/>
  <circle cx="256" cy="300" r="8" fill="#F8FAFC"/>
</svg>
