name: Build iOS and deploy to TestFlight

on:
  workflow_dispatch:
  
  push:
    branches:
      - test

permissions:
  contents: read

concurrency:
  group: carin-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and upload iOS
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60

    env:
      WORKSPACE: ios/CarinIosTest.xcworkspace
      SCHEME: CarinIosTest
      ARCHIVE_PATH: ${{ github.workspace }}/build/CarinIosTest.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Ruby gems
        working-directory: ios
        run: bundle install

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Install Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/Carin.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 --decode > "$PROFILE_PATH"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print Name" \
              "$PROFILE_PLIST"
          )

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Installed profile:"
          echo "$PROFILE_NAME"
          echo "$PROFILE_UUID"

      - name: Create App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$API_KEY_BASE64" \
            | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Archive iOS app
        run: |
          mkdir -p build

          set -o pipefail

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Carin_iOS_Test_App_Store" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean archive

      - name: Export IPA
        run: |
          set -o pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Find IPA
        id: ipa
        run: |
          IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" -type f | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "No IPA file produced."
            exit 1
          fi

          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

          echo "IPA found:"
          echo "$IPA_PATH"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CarinIosTest-${{ github.run_number }}
          path: build/export/*.ipa
          retention-days: 14

      - name: Cleanup credentials
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/app-signing.keychain-db" \
            2>/dev/null || true

          rm -rf "$HOME/.appstoreconnect/private_keys"